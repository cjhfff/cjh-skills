<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0073e6;
        }
        .contact {
            margin-top: 20px;
            font-size: 1.1em;
        }
        .contact a {
            color: #0073e6;
            text-decoration: none;
        }
        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>杨悦的个人主页</h1>
        <p>你好！我是杨悦，一名热爱技术的开发者。我对人工智能、自动化和软件开发充满热情。</p>
        <p>我喜欢探索新技术，解决复杂问题，并创造有用的工具来帮助他人。</p>
        
        <div class="contact">
            <h2>联系方式</h2>
            <p>Email: <a href="mailto:yangyue@example.com">yangyue@example.com</a></p>
            <p>GitHub: <a href="https://github.com/yangyue" target="_blank">github.com/yangyue</a></p>
        </div>
    </div>
</body>
</html>
